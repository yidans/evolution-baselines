[project]
name = "evolution-baselines"
version = "0.1.0"
description = "Standalone link-prediction comparison baselines: sampling, program evolution and OpenEvolve export"
readme = "README.md"
authors = [
    { name = "Yidan", email = "51386779+yidans@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "openai>=3.19.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
evolution-baselines = "evolution_baselines.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build>=1.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs candidate subprocesses on the included benchmark"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/evolution_baselines/benchmarks"]

[tool.ruff.lint]
# Preserve the source project's Ruff 0.15 default rule set across Ruff versions.
select = ["E4", "E7", "E9", "F"]
